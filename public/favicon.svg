<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#0B0F19" stroke="url(#emeraldGrad)" stroke-width="3" />

  <!-- Outer ambient ring -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" stroke-dasharray="8 4" opacity="0.6" />

  <!-- Letter A with Graduation Cap styling -->
  <path d="M 50 24 L 72 72 H 60 L 54 58 H 46 L 40 72 H 28 Z M 50 44 L 48 50 H 52 Z" fill="url(#emeraldGrad)" filter="url(#glow)" />
  
  <!-- AI Sparkle Dot -->
  <circle cx="70" cy="30" r="6" fill="url(#purpleGrad)" filter="url(#glow)" />
</svg>